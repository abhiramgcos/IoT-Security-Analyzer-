version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-analyzer-backend
    # Host networking - no ports mapping needed
    network_mode: "host"
    environment:
      - SCAN_SUBNET=192.168.1.0/24
      - SCAN_INTERFACE=eth0
      - DB_PATH=./data/devices.db
      - FIRMWARE_CACHE_DIR=./data/firmware
      - REPORT_DIR=./data/reports
      - PCAP_DIR=./data/pcaps
      - LOG_DIR=./data/logs
      - LOG_LEVEL=INFO
      # Crucial: NVD API Key from .env is strictly passed through
      - NVD_API_KEY=${NVD_API_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    # Capabilities for packet capture and scanning
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: iot-analyzer-frontend
    # Host networking to access backend easily and avoid bridge isolation
    network_mode: "host"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - API_URL=http://127.0.0.1:8000
    volumes:
      - ./frontend:/app/frontend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - backend

# No bridge networks needed for host mode
