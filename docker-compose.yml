version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-analyzer-backend
    ports:
      - "8000:8000"
    environment:
      - SCAN_SUBNET=192.168.1.0/24
      - SCAN_INTERFACE=eth0
      - DB_PATH=./data/devices.db
      - FIRMWARE_CACHE_DIR=./data/firmware
      - REPORT_DIR=./data/reports
      - PCAP_DIR=./data/pcaps
      - LOG_DIR=./logs
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: iot-analyzer-frontend
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - API_URL=http://backend:8000
    volumes:
      - ./frontend:/app/frontend
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - backend

networks:
  iot-network:
    driver: bridge
